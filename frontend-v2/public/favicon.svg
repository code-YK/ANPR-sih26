<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Sentinel mark: an original badge silhouette (not a reproduction of any
    real government or department emblem) holding a CCTV camera glyph, in
    the console's own palette (the ink-900 / ink-700 / entity / haze-100 /
    nominal tokens in style.css).

    Keep double hyphens out of this comment. XML forbids them inside a
    comment, browsers parse favicons with a strict XML parser, and the file
    then fails to render with no error anywhere: naming the CSS custom
    properties the usual way is exactly what broke this icon before.
  -->
  <rect width="32" height="32" rx="7" fill="#000000" />

  <!-- badge / shield silhouette -->
  <path
    d="M16 3.6 L26.6 7.7 V15.7 C26.6 21.8 22 26.6 16 28.6 C10 26.6 5.4 21.8 5.4 15.7 V7.7 Z"
    fill="#161616"
    stroke="#7ba2f0"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- CCTV camera, side profile: mounting arm, body, lens -->
  <g stroke="#f2f2f2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M11.9 12.2 V10.2 H16.2" />
    <rect x="9.7" y="12.2" width="8.8" height="5.8" rx="1.5" fill="#161616" />
  </g>
  <circle cx="20.8" cy="15.1" r="3.1" fill="#161616" stroke="#f2f2f2" stroke-width="1.9" />
  <circle cx="20.8" cy="15.1" r="1.25" fill="#3ad98c" />
</svg>
